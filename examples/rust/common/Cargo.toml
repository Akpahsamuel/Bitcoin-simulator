[package]
name = "bitcoin-sandbox-common"
version = "0.1.0"
edition = "2021"

[dependencies]
dotenvy = "0.15"
# rustls-tls (pure Rust) instead of the default native-tls, so the crate builds
# with no system OpenSSL / libssl-dev. Regtest RPC is plain HTTP anyway.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bitcoin = { version = "0.32", features = ["rand", "serde"] }
